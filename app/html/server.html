<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SRB2 Server Manager</title>
    <link rel="stylesheet" href="app/css/bootstrap.css">
    <link rel="stylesheet" href="app/css/style.css">
    <link rel="stylesheet" href="app/css/server.css">
</head>
<body class="text-white">

    <div id="widget-background" class="background d-none">

        <div id="config-server" class="card card_form d-none">
            <div class="card-header">
                <h1>Server configuration</h1>
            </div>
            <nav>
                <button class="btn text-white" onclick="SwitchContainer('server_card_general')">General</button>
                <button class="btn text-white" onclick="SwitchContainer('server_card_rules')">Rules</button>
                <button class="btn text-white" onclick="SwitchContainer('server_card_network')">Network</button>
                <button class="btn text-white" onclick="SwitchContainer('server_card_commands')">commands</button>
            </nav>
            <div class="card-body">
                <form id="form_server" action="index.php?manage=server" method="post">
                    <input id="form-server-name" type="hidden" name="Name" value="">
                    <input type="hidden" name="action" value="update_server">
                    <div id="server_card_general" class="d-flex flex-column justify-content-between gap-2">
                        <label class="d-flex flex-column">
                            Server Name
                            <input type="text" id="config-server-name" readonly>
                        </label>
                        <label class="d-flex flex-column">
                            Display Name
                            <input type="text" id="config-server-displayName" name="displayName">
                        </label>
                        <label class="d-flex flex-column">
                            MOTD
                            <input id="config-server-motd" type="text" name="MOTD">
                        </label>
                        <label class="d-flex flex-column">
                            Max Players
                            <input id="config-server-maxplayers" type="range" min="1" max="32" name="maxplayers" value="16">
                            <datalist>
                                <option value="1" label="1"></option>
                                <option value="32" label="32"></option>
                            </datalist>
                        </label>
                    </div>
                    <div id="server_card_rules" class="d-flex flex-row d-none gap-2">
                        <div class="d-flex flex-column gap-2">
                            <label class="d-flex flex-column gap">
                                Default Gametype
                                <select id="config-server-gametype" name="gametype" onchange="init_map_selector('config-server-map',this.value,'')"></select>
                            </label>
                            <label class="d-flex flex-column">
                                Time limit
                                <input id="config-server-timelimit" type="text" name="timeLimit">
                            </label>
                            <label class="d-flex flex-column">
                                Force Character
                                <select id="config-server-forcecharacter" name="forceCharacter"></select>
                            </label>
                        </div>
                        <div class="d-flex flex-column gap-2">
                            <label class="d-flex flex-column">
                                Default Map
                                <select id="config-server-map" name="map"></select>
                            </label>
                            <label class="d-flex flex-column">
                                Point limit
                                <input id="config-server-pointlimit" type="text" name="pointLimit">
                            </label>
                        </div>
                    </div>
                    <div id="server_card_network" class="d-flex flex-row d-none gap-2">
                        <div class="d-flex flex-column gap-2">
                            <label class="d-flex flex-column gap">
                                Port
                                <input type="text" id="config-server-port" name="port">
                            </label>
                            <label class="d-flex flex-column gap">
                                Admin password
                                <input id="config-server-password" type="text" name="password">
                            </label>
                            <label class="d-flex flex-column gap">
                                masterserver
                                <input id="config-server-masterserver" type="text" name="masterServer">
                            </label>
                            <label class="d-flex flex-column gap">
                                Room
                                <select id="config-server-room" name="room"></select>
                            </label>
                        </div>
                        <div class="d-flex flex-column gap-2">
                            <label class="d-flex flex-column gap">
                                Allow download
                                <div>
                                    <input id="config-server-allowdownload" type="checkbox" name="allowDownload">
                                </div>
                            </label>
                            <label class="d-flex flex-column gap">
                                max size
                                <input id="config-server-downloadsize" type="range" min="0" max="200" value="4" name="downloadSize">
                                <datalist>
                                    <option value="0" label="1mb"></option>
                                    <option value="200" label="200mb"></option>
                                </datalist>
                            </label>
                        </div>
                    </div>
                    <div id="server_card_commands" class=" d-flex flex-column gap-2 d-none">
                        <div id="config-server-commands" >
                            <table id="config-server-commands-table" class="table table-striped table-dark">
                                <thead class="sticky-top">
                                <tr>
                                    <th><input type="checkbox" onchange="check_all_table_datas(this.checked,'config-server-commands-table-tbody')"></th>
                                    <th class="col col-10">Commands</th>
                                    <th><button type="button" class="btn btn-red" onclick="remove_commands('config-server-commands-table')">Remove</button></th>
                                </tr>
                                </thead>
                                <tbody id="config-server-commands-table-tbody">
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex gap-2"><input id="config-server-command-input" class="w-100" type="text"><button type="button" onclick="add_command('config-server-commands-table',this.parentElement.children[0].value)" class="btn btn-primary">Add</button></div>
                    </div>
                </form>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <button class="btn btn-red" onclick="Close('widget-background'); Close('config-server')">Cancel</button>
                <input type="submit" form="form_server" value="Update" class="btn btn-primary">
            </div>
        </div>

        <div id="config-add-addons" class="card card_form d-none">
            <div class="card-header">
                <h1>Add Addons</h1>
            </div>
            <div id="list_addons" >
                <table class="table table-dark table-striped">
                    <thead class="sticky-top">
                    <tr>
                        <th><input type="checkbox" onclick="check_all_table_datas(this.checked,'list-addons-to-add')"></th>
                        <th></th>
                        <th>Name</th>
                    </tr>
                    </thead>
                    <tbody id="list-addons-to-add"></tbody>
                </table>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <button class="btn btn-red" onclick="Close('widget-background'); Close('config-add-addons')">Cancel</button>
                <button class="btn btn-valide" onclick="add_addons(); Close('widget-background'); Close('config-add-addons')">Add</button>
            </div>
        </div>
    </div>

    <header>
        <a href="index.php" id="logo"><img src="app/img/srb2org-banner.png" alt="logo"></a>
        <div id="notifications" class="d-flex flex-column gap-2"></div>
    </header>
    <main>
        <div id="content">
            <div class="d-flex flex-row gap-3">
                <div class="card w-50">
                    <div class="card-header">
                        <h1>Server Status</h1>
                    </div>
                    <div class="card-body ">
                        <div class="d-flex flex-column gap-2">
                            <div class="d-flex flex-row gap-2">
                                <div class="card w-25">
                                    <div class="card-header">
                                        <strong>Name</strong>
                                    </div>
                                    <div class="card-body">
                                        <span id="server-name"></span>
                                    </div>
                                </div>
                                <div class="card w-25">
                                    <div class="card-header">
                                        <strong>Port</strong>
                                    </div>
                                    <div class="card-body">
                                        <span id="server-port"></span>
                                    </div>
                                </div>
                                <div class="card w-25">
                                    <div class="card-header">
                                        <strong>Uptime</strong>
                                    </div>
                                    <div class="card-body">
                                        <span id="server-time">1</span>
                                    </div>
                                </div>
                                <div class="card w-25">
                                    <div class="card-header">
                                        <strong>State</strong>
                                    </div>
                                    <div class="card-body">
                                        <span id="server-state"></span>
                                    </div>

                                </div>
                            </div>
                            <div class="d-flex flex-row gap-2">
                                <div class="card w-50">
                                    <div class="card-body">
                                        <div class="d-flex flex-row justify-content-between">
                                            <strong>CPU : </strong>
                                            <strong id="server-cpu"></strong>
                                        </div>
                                        <div>

                                        </div>
                                    </div>
                                </div>
                                <div class="card w-50">
                                    <div class="card-body">
                                        <div class="d-flex flex-row justify-content-between">
                                            <strong>RAM : </strong>
                                            <strong id="server-ram"></strong>
                                        </div>
                                        <div>

                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="btn-group">
                                <button class="btn btn-valide" onclick="action('start')">Start</button>
                                <button class="btn btn-primary" onclick="action('restart')">Restart</button>
                                <button class="btn btn-primary" onclick="Open('widget-background'); Open('config-server')">Configure</button>
                                <button class="btn btn-red" onclick="action('kill')">Kill</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card w-50">
                    <div class="card-header">
                        <h1>Rules</h1>
                    </div>
                    <div class="card-body d-flex flex-column gap-1">
                        <div class="d-flex flex-row w-100 gap-1">
                            <div class="d-flex flex-column gap-1 w-50">
                                <h3>Maps and gamemodes</h3>
                                <div class="d-flex flex-row gap-1">
                                    <label for="gametype-changer" class="d-flex flex-column w-100">
                                        gametype
                                        <select id="gametype-changer" class="w-100" onchange="init_map_selector('map-changer',this.value,'')"></select>
                                    </label>
                                    <label for="map-changer" class="d-flex flex-column w-100">
                                        Map
                                        <select id="map-changer" class="w-100"></select>
                                    </label>
                                </div>
                                <div>
                                    <input class="btn btn-primary" type="button" onclick="setMap()" value="Set">
                                </div>
                            </div>
                            <div class="d-flex flex-column gap-1 w-50">
                                <h3>Limits</h3>
                                <div class="d-flex flex-row gap-2 ">
                                    <label for="timelimit-changer" class="d-flex flex-column w-100">
                                        Time limit
                                        <input id="timelimit-changer" class="w-100" type="text"/>
                                    </label>
                                    <label for="pointlimit-changer" class="d-flex flex-column w-100">
                                        Point limit
                                        <input id="pointlimit-changer" class="w-100" type="text" />
                                    </label>
                                </div>
                                <div>
                                    <input class="btn btn-primary" type="button" onclick="set_time_and_point_limits()" value="Set">
                                </div>
                            </div>
                        </div>
                        <div class="d-flex flex-column gap-1 ">
                            <div class="d-flex flex-column w-50">
                                <h3>Character</h3>
                                <label for="character-changer" class="d-flex flex-column ">
                                    force character
                                    <select id="character-changer" class="w-100" onchange=""></select>
                                </label>
                            </div>
                            <div>
                                <input class="btn btn-primary" type="button" onclick="forceCharacter()" value="Set">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-row gap-3">
                <div class="d-flex flex-column gap-4 w-50">
                    <div class="card w-100">
                        <div class="card-header d-flex flex-row gap-3 align-items-center">
                            <h1>Players</h1>
                            <div class="input-group">
                                <input type="text" class="form-control" id="player-search" placeholder="Search a player…">
                                <button class="btn btn-primary" id="players-refresh" onclick="refresh_players()">Refresh</button>
                            </div>
                        </div>
                        <div class="col-12" id="players-section">
                            <div class="table-responsive">
                                <table class="table table-hover table-dark table-striped" id="players-table">
                                    <thead>
                                    <tr><th>#</th><th>Name</th><th>Ip</th><th>Port</th><th class="text-end">Actions</th></tr>
                                    </thead>
                                    <tbody id="players-body">
                                    <tr><td colspan="5">no players found</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="card w-100">
                        <div class="card-header d-flex flex-row gap-3 align-items-center">
                            <h1>Bans</h1>
                            <div class="input-group">
                                <input type="text" class="form-control" id="bans-search" placeholder="Search an ip adress…">
                                <button class="btn btn-primary" id="bans-refresh" onclick="refresh_bans()">Refresh</button>
                                <button class="btn btn-red" id="clear-bans" onclick="clearBans()">clear bans</button>
                            </div>
                        </div>
                        <div class="col-12" id="bans-section">
                            <div class="table-responsive">
                                <table class="table table-hover table-dark table-striped" id="bans-table">
                                    <thead>
                                        <tr>
                                            <th>Ip</th>
                                            <th class="text-end">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bans-body">
                                    <tr><td colspan="2">no bans found</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="addons" class="card w-50">
                    <div class="card-header">
                        <h1>Addons</h1>
                    </div>
                    <div class="overflow-scroll">
                        <table id="table-addons" class="table table-dark table-striped">
                            <thead class="sticky-top">
                            <tr>
                                <th><input type="checkbox" onclick="check_all_table_datas(this.checked,'server-addons')"></th>
                                <th>icon</th>
                                <th>Name</th>
                            </tr>
                            </thead>
                            <tbody id="server-addons"></tbody>
                        </table>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button class="btn btn-valide" onclick="Open('widget-background'); Open('config-add-addons')">add Addon</button>
                        <button class="btn btn-red" onclick="remove_Addons()">Remove Addons</button>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-column gap-3">
                <div class="card w-100">
                    <div class="card-header">
                        <h1 class="section-title">Broadcast</h1>
                        <div class="input-group">
                            <input type="text" class="form-control" id="message-input" placeholder="Message to all players…">
                            <button class="btn btn-primary" id="message-send" onclick="send_message()">Send</button>
                        </div>
                    </div>
                </div>
                <div id="console" class="card w-100">
                    <div class="card-header">
                        <h1>Console</h1>
                    </div>
                    <div class="card-body d-flex flex-column gap-2">
                        <span id="console-content"></span>
                    </div>
                    <div class="card-footer gap-2">
                        <div class="input-group ">
                            <input type="text" id="command" class="form-control" placeholder="Type command..." >
                            <button class="btn btn-primary" onclick="sendCommand()" >Send</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="app/js/main.js"></script>
    <script src="app/js/server.js"></script>
</body>
</html>
