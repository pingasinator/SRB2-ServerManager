<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="app/css/style.css">
    <link rel="stylesheet" href="app/css/bootstrap.css">
    <title>SRB2 Server Manager</title>
</head>
<body class="bg-dark d-flex flex-row">

<div id="left-bar">
    <button>Server</button>
    <button>Addons</button>
</div>
<main>
    <div id="content" class="d-flex flex-column">
        <header>
            <nav>
                <a href="index.php"><img src="app/img/srb2org-banner.png" alt="logo"></a>
                <button>install SRB2</button>
            </nav>
            <div id="notification" class="hidden">
            </div>
        </header>
        <div class="card bg-secondary text-white">
            <div id="action-bar">
                <h2>Addons</h2>
                <button onclick="display_form_addon()">import</button>
            </div>

            <table id="addon-table">
                <thead>
                <tr>
                    <th><input id="check_all" type="checkbox" onchange="select_all_servers(this)"></th>
                    <th>Name</th>
                </tr>
                </thead>
                <tbody id="list-addons">
                </tbody>
            </table>
        </div>

        <div class="card d-none" id="form_addons">
            <form action="index.php" method="post" class="form_addon" enctype="multipart/form-data">
                <input type="hidden" name="gestion" value="addon">
                <input type="hidden" name="action" value="import_addon">
                <input type="file" name="addon" >
                <div id="form_addon_buttons">
                    <button id="Cancel" onclick="hide_form_addon()">Cancel</button>
                    <input type="submit" value="Create">
                </div>
            </form>
        </div>
    </div>
</main>
</body>

<script src="app/js/jquery.js"></script>
<script src="app/js/main.js"></script>
<script src="app/js/addons.js"></script>
</html>
