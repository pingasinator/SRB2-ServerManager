<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="app/css/style.css">
    <link rel="stylesheet" href="app/css/bootstrap.css">
    <title>SRB2 Server Manager</title>
</head>
<body class="bg-dark d-flex flex-row">

<div id="left-bar">
    <button>Server</button>
    <button>Addons</button>
</div>
<main>
    <div id="content" class="d-flex flex-column">
        <header>
            <nav>
                <a href="index.php"><img src="app/img/srb2org-banner.png" alt="logo"></a>
                <button>install SRB2</button>
            </nav>
            <div id="notification" class="hidden">
            </div>
        </header>
        <div class="card bg-secondary text-white">
            <div id="action-bar">
                <h2>Addons</h2>
            </div>

            <table id="addon-table">
                <thead>
                <tr>
                    <th><input id="check_all" type="checkbox" onchange="select_all_servers(this)"></th>
                    <th>Name</th>
                </tr>
                </thead>
                <tbody id="list-servers">
                </tbody>
            </table>
        </div>

        <div class="card d-none" id="server">
            <form action="index.php" method="post" class="form_server">
                <input type="hidden" name="gestion" value="accueil">
                <input type="hidden" name="action" value="create_server">
                <label for="Name">Name</label>
                <input id="Name" name="Name" value="server">
                <label for="Port">Port</label>
                <input id="Port" name="Port" value="5029">
                <label for="MaxPlayers">MaxPlayers</label>
                <input id="MaxPlayers" name="MaxPlayers" value="16">
                <label for="Map">Map</label>
                <select id="Map" name="Map"></select>
                <label for="GameType">gametype</label>
                <select id="GameType" name="GameType"></select>
                <div id="form_server_buttons">
                    <button id="Cancel" onclick="hide_form_server()">Cancel</button>
                    <input type="submit" value="Create">
                </div>

            </form>
        </div>
    </div>
</main>
</body>

<script src="app/js/jquery.js"></script>
<script src="app/js/main.js"></script>
<script src="app/js/home.js"></script>
</html>
